<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Links Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <!-- Estilização -->
    <link rel="shortcut icon" href="img/favicon.ico"/>
    <link rel="stylesheet" href="./css/style.css">
    <title>Universidade Luva de Predeiro - Início</title>
    <!--- Scripts -->
    <script src="scripts/toast.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top" data-bs-theme="dark" style="background-color: #101244">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" alt="Logo da Universidade Luva de Predeiro" width="80" height="80" class="d-inline-block align-text-center m-2">
            </a>
            <button class="navbar-toggler m-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item fs-4 bebas-neue-regular">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item fs-4 bebas-neue-regular">
                        <a class="nav-link" href="quem-somos.html">Quem somos</a>
                    </li>
                    <li class="nav-item fs-4 bebas-neue-regular">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section name="formulario" class="container align-items-center justify-content-center p-2">
        <h2 class="bebas-neue-regular text-white display-5 p-4">Entre em contato conosco</h2>
        <form class="col-sm-6 bebas-neue-regular">
            <label for="email" style="color: white; font-size: x-large;">Email</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu email"><br>
            <label for="telefone" style="color: white; font-size: x-large;">telefone</label>
            <input type="tel" name="tel" id="tel" class="form-control" placeholder="Digite seu telefone"><br>
            <label for="nome" style="color: white; font-size: x-large;">Nome Completo</label>
            <input type="text" name="nome" id="nome" class="form-control" placeholder="Digite seu nome inteiro"><br><br>
            <button type="button" class="btn btn-secondary" id="liveToastBtn">
                Enviar
            </button>
        </form>
    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Seu formulário foi enviado com sucesso!
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <footer class="container d-flex align-items-center justify-content-center">
        <p class="text-white text-center">&copy 2026 Universidade Luva de Predeiro. Nenhum direito reservado. Eu acho.</p>
    </footer>
</body>
</html>
