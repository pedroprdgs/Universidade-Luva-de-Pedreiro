    <title>Universidade Luva de Predeiro - Início</title>

<body>
    <nav class="navbar" style="background-color: #101244">
        <section name="menu" class="container d-flex align-items-center justify-content-between">
            <section name="logo" class="col-md-2 d-flex align-items-center justify-content-center">
                <a href="index.html">
                    <img src="img/logo.png" alt="Logo da Universidade Luva de Predeiro" class="img-fluid" style="max-width: 150px;">
                </a>
            </section>
            <section name="nav-bar" class="col-md-10 d-flex align-items-center justify-content-end">

    <section name="formulario" class="container align-items-center justify-content-center p-2">
        <h2 class="bebas-neue-regular text-white display-5 p-4">Entre em contato conosco</h2>
        <form class="col-sm-6 bebas-neue-regular">
            <label for="email" style="color: white; font-size: x-large;">Email</label>
            <input type="email" name="email" id="email" class="form-control">
            <label for="telefone" style="color: white; font-size: x-large;">telefone</label>
            <input type="tel" name="tel" id="tel" class="form-control">
            <label for="nome" style="color: white; font-size: x-large;">Nome Completo</label>
            <input type="text" name="nome" id="nome" class="form-control"><br>
            <input type="submit" value="Enviar" class="btn btn-secondary">
        </form>
